<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGET · 全平台视频下载</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #141218;
    --surface-low: #1d1b20;
    --surface-container: #211f26;
    --surface-container-high: #2b2930;
    --surface-container-highest: #36343b;
    --surface-container-lowest: #0f0d13;
    --on-surface: #e6e0e9;
    --on-surface-variant: #cac4d0;
    --primary: #d0bcff;
    --on-primary: #381e72;
    --primary-container: #4f378b;
    --on-primary-container: #eaddff;
    --tertiary: #efb8c8;
    --tertiary-container: #633b48;
    --on-tertiary-container: #ffd9e2;
    --outline: #938f99;
    --outline-variant: #49454f;
    --error: #f2b8b5;
    --success: #a5d6a7;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal;
    font-size: 20px; line-height: 1;
    letter-spacing: normal; text-transform: none;
    display: inline-block; white-space: nowrap; word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--surface-low);
    border-bottom: 1px solid var(--outline-variant);
    flex-shrink: 0;
    -webkit-app-region: drag;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 22px; height: 22px; color: var(--primary); }
  .logo h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
  .header-actions { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--surface-container-highest); color: var(--on-surface);
    border: none; cursor: pointer; transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-container-high); }

  main { flex: 1; display: flex; overflow: hidden; }

  .left { width: 100%; overflow-y: auto; padding: 28px 32px; }
  .left-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .headline h2 { font-size: 24px; font-weight: 700; }
  .headline p { color: var(--on-surface-variant); font-size: 13px; margin-top: 4px; }

  .input-wrap { display: flex; flex-direction: column; gap: 12px; }
  textarea {
    width: 100%; height: 92px; resize: none;
    background: var(--surface-container-highest); color: var(--on-surface);
    border: 2px solid transparent; border-radius: 10px;
    padding: 12px; font-size: 14px; line-height: 1.5;
    outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: var(--outline); }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none; transition: all .15s; padding: 0 16px;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: var(--surface-container-highest); color: var(--on-surface); flex: 1; }
  .btn-ghost:hover { background: var(--surface-container-high); }
  .btn-primary {
    background: var(--primary-container); color: var(--on-primary-container);
    flex: 1.5; border: 1px solid var(--primary);
  }
  .btn-primary:hover { background: #5d46a0; }
  .btn-accent {
    background: var(--tertiary-container); color: var(--on-tertiary-container);
    flex: 1.5; border: 1px solid var(--tertiary);
  }
  .btn-accent:hover { background: #71465a; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .platforms { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--surface-low); border-radius: 10px; border: 1px solid var(--outline-variant); flex-wrap: wrap; }
  .platforms .label { font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--outline); }
  .platforms .item { display: flex; align-items: center; gap: 6px; color: var(--on-surface-variant); font-size: 12px; }
  .platforms .item .material-symbols-outlined { font-size: 17px; color: var(--primary); }

  .clip-preview { display: none; padding: 12px; background: var(--surface-low);
    border-radius: 10px; border: 1px solid var(--outline-variant); font-size: 12px; color: var(--on-surface-variant); }
  .clip-preview.show { display: block; }
  .clip-preview .url { color: var(--primary); word-break: break-all; font-family: ui-monospace, monospace; margin-top: 6px; display: block; }

  .result-card { display: none; background: var(--surface-low); border: 1px solid var(--outline-variant);
    border-radius: 12px; padding: 14px; gap: 14px; }
  .result-card.show { display: flex; }
  .thumb { width: 150px; height: 88px; border-radius: 8px; background-size: cover;
    background-position: center; background-color: var(--surface-container-high); flex-shrink: 0; position: relative; }
  .thumb .dur { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.7);
    color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .result-info { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .result-info .title { font-size: 14px; font-weight: 700; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-info .meta { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--on-surface-variant); flex-wrap: wrap; }
  .result-info .meta .badge { background: var(--primary-container); color: var(--on-primary-container);
    padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .meta-item { display: flex; align-items: center; gap: 4px; }

  .tasks { display: flex; flex-direction: column; gap: 10px; }
  .tasks .section-title { font-size: 12px; font-weight: 700; color: var(--outline);
    text-transform: uppercase; letter-spacing: .08em; }
  .task { background: var(--surface-low); border: 1px solid var(--outline-variant);
    border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .task .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .task .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .status { font-size: 11px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
  .task .status.done { color: var(--success); }
  .task .status.error { color: var(--error); }
  .task .status.working { color: var(--primary); }
  .bar { height: 6px; background: var(--surface-container-highest); border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--primary); border-radius: 3px; width: 0%; transition: width .3s; }
  .task .msg { font-size: 11px; color: var(--on-surface-variant); }
  .task .path { font-size: 11px; color: var(--success); word-break: break-all; font-family: ui-monospace, monospace; }

  /* 美化滚动条（匹配 Material 深色主题） */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--surface-container-highest);
    border-radius: 8px;
    border: 2px solid var(--surface);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--outline-variant); }
  ::-webkit-scrollbar-corner { background: transparent; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface-container); border-radius: 16px; padding: 22px; width: 420px;
    display: flex; flex-direction: column; gap: 14px; }
  .modal h3 { font-size: 16px; font-weight: 700; }
  .modal label { font-size: 12px; color: var(--on-surface-variant); }
  .modal input { width: 100%; background: var(--surface-container-highest); color: var(--on-surface);
    border: 1px solid var(--outline-variant); border-radius: 8px; padding: 9px 10px; font-size: 13px; outline: none; }
  .modal input:focus { border-color: var(--primary); }
  .modal .btn-row { justify-content: flex-end; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-container-highest); border: 1px solid var(--outline-variant);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path d="M8.58 8.58C5.53 11.63 3.45 15.51 2.61 19.75c-.84 4.23-.41 8.61 1.24 12.6 1.65 3.99 4.45 7.39 8.03 9.79 3.59 2.4 7.8 3.67 12.12 3.67s8.53-1.28 12.12-3.67c3.58-2.4 6.38-5.8 8.03-9.79 1.65-3.99 2.08-8.37 1.24-12.6-.84-4.24-2.92-8.12-5.97-11.17L24 24 8.58 8.58Z" fill="currentColor"/>
    </svg>
    <h1>VGET</h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btnSettings" title="设置">
      <span class="material-symbols-outlined" style="font-size:20px">settings</span>
    </button>
  </div>
</header>

<main>
  <section class="left">
    <div class="left-inner">
      <div class="headline">
        <h2>全平台视频下载</h2>
        <p>粘贴分享文案或链接，一键解析并下载无水印原视频</p>
      </div>

      <div class="input-wrap">
        <textarea id="urlInput" placeholder="在此粘贴视频链接或分享文案（如抖音「复制打开抖音，看看…」整段文字）"></textarea>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btnClipboard">
            <span class="material-symbols-outlined">content_paste</span>
            <span>读取剪贴板</span>
          </button>
          <button class="btn btn-primary" id="btnParse">
            <span class="material-symbols-outlined" id="parseIcon">bolt</span>
            <span id="parseText">解析视频</span>
          </button>
        </div>
      </div>

      <div class="clip-preview" id="clipPreview"></div>

      <div class="platforms">
        <span class="label">支持平台</span>
        <span class="item"><span class="material-symbols-outlined">music_note</span>抖音</span>
        <span class="item"><span class="material-symbols-outlined">smart_display</span>B站</span>
        <span class="item"><span class="material-symbols-outlined">play_circle</span>YouTube</span>
        <span class="item"><span class="material-symbols-outlined">videocam</span>TikTok</span>
      </div>

      <div class="result-card" id="resultCard">
        <div class="thumb" id="thumb"><span class="dur" id="dur"></span></div>
        <div class="result-info">
          <div class="title" id="rTitle"></div>
          <div class="meta">
            <span class="badge" id="rPlatform"></span>
            <span class="meta-item" id="rUploader"><span class="material-symbols-outlined" style="font-size:14px">account_circle</span><span id="rUploaderName"></span></span>
            <span class="meta-item" id="rDuration"><span class="material-symbols-outlined" style="font-size:14px">schedule</span><span id="rDurationText"></span></span>
          </div>
          <div class="btn-row" style="margin-top:auto">
            <button class="btn btn-accent" id="btnDownload" style="flex:1">
              <span class="material-symbols-outlined">download</span>
              <span>下载</span>
            </button>
          </div>
        </div>
      </div>

      <div class="tasks">
        <div class="section-title">下载任务</div>
        <div id="taskList"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>设置</h3>
    <div>
      <label>输出目录</label>
      <input id="cfgOutdirInput" placeholder="~/Downloads">
    </div>
    <div>
      <label>Cookies 文件（B站/YouTube/TikTok 用）</label>
      <input id="cfgCookiesInput" placeholder="~/Downloads/cookies.txt">
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancel" style="flex:1">取消</button>
      <button class="btn btn-primary" id="btnSave" style="flex:1.5">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let parsedUrl = '';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDuration(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = s % 60;
  return m > 0 ? `${m}:${String(sec).padStart(2, '0')}` : `${sec}s`;
}

const PLATFORM_NAMES = { douyin: '抖音', bilibili: 'B站', youtube: 'YouTube', tiktok: 'TikTok', other: '其他' };

// 前端正则兜底：从混合文案提取 URL
function extractUrlLocal(text) {
  const m = text.match(/https?:\/\/[^\s\u4e00-\u9fff，。；：！？、]+/);
  return m ? m[0].replace(/[，。；：""''（）【】,.!?;:)]+$/, '') : null;
}

// 读取剪贴板
$('btnClipboard').addEventListener('click', async () => {
  const btn = $('btnClipboard');
  btn.disabled = true;
  try {
    const d = await window.vget.readClipboard();
    if (d.url) {
      $('urlInput').value = d.url;
      parsedUrl = d.url;
      // 剪贴板内容不可信，用 textContent 构造，避免 HTML 注入
      const span = document.createElement('span');
      span.className = 'url';
      span.textContent = d.url;
      $('clipPreview').replaceChildren('从剪贴板识别到链接：', span);
      $('clipPreview').classList.add('show');
      toast('已从剪贴板提取链接');
    } else {
      $('clipPreview').textContent = '剪贴板里没有识别到有效链接，请先在 App 里点「复制链接」。';
      $('clipPreview').classList.add('show');
      toast('未识别到链接');
    }
  } catch (e) {
    toast('读取剪贴板失败：' + e.message);
  } finally {
    btn.disabled = false;
  }
});

$('urlInput').addEventListener('input', () => {
  parsedUrl = $('urlInput').value.trim();
});

// 解析
$('btnParse').addEventListener('click', async () => {
  const raw = $('urlInput').value.trim();
  if (!raw) { toast('请先粘贴链接或点「读取剪贴板」'); return; }
  if (!/^https?:\/\//i.test(raw)) {
    const u = extractUrlLocal(raw);
    if (u) { parsedUrl = u; $('urlInput').value = u; }
    else { toast('未在输入中找到有效链接'); return; }
  } else {
    parsedUrl = raw;
  }

  $('parseIcon').textContent = 'sync';
  $('parseIcon').classList.add('spin');
  $('parseText').textContent = '解析中...';
  $('btnParse').disabled = true;
  try {
    const d = await window.vget.parse(parsedUrl);
    $('rTitle').textContent = d.title || parsedUrl;
    $('rPlatform').textContent = PLATFORM_NAMES[d.platform] || '其他';
    $('thumb').style.backgroundImage = d.thumbnail ? `url(${JSON.stringify(d.thumbnail)})` : '';
    $('dur').textContent = fmtDuration(d.duration);
    $('rUploaderName').textContent = d.uploader || '';
    $('rUploader').style.display = d.uploader ? 'flex' : 'none';
    $('rDurationText').textContent = fmtDuration(d.duration);
    $('rDuration').style.display = d.duration ? 'flex' : 'none';
    $('resultCard').classList.add('show');
  } catch (e) {
    toast('解析失败：' + e.message);
  } finally {
    $('parseIcon').textContent = 'bolt';
    $('parseIcon').classList.remove('spin');
    $('parseText').textContent = '解析视频';
    $('btnParse').disabled = false;
  }
});

// 下载
$('btnDownload').addEventListener('click', async () => {
  if (!parsedUrl) { toast('请先解析或输入链接'); return; }
  try {
    const taskId = await window.vget.download(parsedUrl);
    addTask(taskId, parsedUrl);
    toast('已开始下载');
  } catch (e) { toast('下载失败：' + e.message); }
});

// 任务列表（通过主进程推送的进度更新，不再轮询）
const taskEls = {};
function addTask(id, url) {
  const div = document.createElement('div');
  div.className = 'task';
  div.id = 'task-' + id;
  div.innerHTML = `
    <div class="row">
      <span class="name"></span>
      <span class="status working"><span class="material-symbols-outlined spin" style="font-size:14px">sync</span>准备中</span>
    </div>
    <div class="bar"><div class="fill"></div></div>
    <div class="msg"></div>`;
  div.querySelector('.name').textContent = url;
  $('taskList').prepend(div);
  taskEls[id] = div;
}

window.vget.onTaskProgress((d) => {
  const div = taskEls[d.taskId];
  if (!div) return;
  const fill = div.querySelector('.fill');
  const status = div.querySelector('.status');
  const msg = div.querySelector('.msg');
  fill.style.width = (d.progress || 0) + '%';
  msg.textContent = d.message || '';
  if (d.title) div.querySelector('.name').textContent = d.title;
  if (d.status === 'done') {
    status.className = 'status done';
    status.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">check_circle</span>完成';
    if (d.filePath) {
      const p = document.createElement('div');
      p.className = 'path';
      p.textContent = d.filePath;
      div.appendChild(p);
    }
  } else if (d.status === 'error') {
    status.className = 'status error';
    status.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">error</span>失败';
    msg.textContent = d.message || '下载失败';
  } else {
    status.className = 'status working';
    status.innerHTML = '<span class="material-symbols-outlined spin" style="font-size:14px">sync</span>' +
      (d.status === 'parsing' ? '解析中' : Math.round(d.progress || 0) + '%');
  }
});

// 设置
function loadConfig() {
  window.vget.getConfig().then(d => {
    $('cfgOutdirInput').value = d.outdir;
    $('cfgCookiesInput').value = d.cookies;
  });
}
$('btnSettings').addEventListener('click', () => $('modalOverlay').classList.add('show'));
$('btnCancel').addEventListener('click', () => $('modalOverlay').classList.remove('show'));
$('modalOverlay').addEventListener('click', (e) => { if (e.target === $('modalOverlay')) $('modalOverlay').classList.remove('show'); });
$('btnSave').addEventListener('click', async () => {
  await window.vget.setConfig({ outdir: $('cfgOutdirInput').value, cookies: $('cfgCookiesInput').value });
  $('modalOverlay').classList.remove('show');
  loadConfig();
  toast('设置已保存');
});

loadConfig();
</script>
</body>
</html>
